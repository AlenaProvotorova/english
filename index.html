<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Trainer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px}input,button,textarea{font:inherit;padding:13px;border-radius:12px}input,textarea{border:1px solid #d1d5db;width:100%}textarea{min-height:240px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.45}button{border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef2f7;color:#334155}.row{display:flex;gap:10px}.hidden{display:none}.muted{color:#64748b}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tab{background:#eef2f7;color:#334155}.tab.active{background:#2563eb;color:#fff}.prompt{font-size:26px;font-weight:800;margin:16px 0}.options{display:grid;gap:10px}.option{text-align:left;background:#f8fafc;color:#1f2937;border:1px solid #e5e7eb}.correct{background:#dcfce7!important}.wrong{background:#fee2e2!important}.status{padding:12px;border-radius:12px;margin-top:12px}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.word{border-top:1px solid #e5e7eb;padding:10px 0}@media(max-width:650px){.row,.tabs{display:grid}}
</style></head><body><div class="wrap">
<div class="card" id="auth"><h1>English Vocabulary Trainer</h1><p class="muted">Войди по email и паролю. Прогресс будет одинаковым на всех устройствах.</p><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль, минимум 6 символов"></div><div class="row" style="margin-top:10px"><button id="login">Войти</button><button class="secondary" id="signup">Создать аккаунт</button></div><div id="authStatus"></div></div>
<div id="app" class="hidden"><div class="card"><div class="top"><div><b id="account"></b><div class="muted" id="sync"></div></div><button id="logout" class="secondary">Выйти</button></div></div>
<div class="card"><div class="tabs"><button class="tab active" data-mode="choice">Перевод</button><button class="tab" data-mode="blank">Контекст</button><button class="tab" data-mode="situation">Ситуация</button></div><div class="top" style="margin-top:16px"><span id="counter"></span><span id="score"></span></div><div id="exercise"></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button id="hint" class="secondary">Подсказка</button><button id="next" disabled>Следующее</button></div></div>
<div class="card">
<h2>Добавить новые слова</h2>
<p class="muted">Вставь JSON-массив, который я подготовлю. Старые слова и статистика сохранятся.</p>
<textarea id="importJson" spellcheck="false" placeholder='[
  {
    "word": "confused",
    "translation": "растерянный; озадаченный",
    "definition": "unable to understand something clearly",
    "example": "I was confused by the instructions.",
    "exampleTranslation": "Я не могла разобраться в инструкции.",
    "situation": "You do not understand what you need to do.",
    "note": "Confused описывает состояние человека."
  }
]'></textarea>
<div class="row" style="margin-top:10px">
  <button id="importWords">Добавить слова</button>
  <button id="clearImport" class="secondary">Очистить поле</button>
</div>
<div id="importStatus"></div>
</div>
<div class="card"><h2>Словарь</h2><div id="words"></div></div></div></div>
<script>
const sb=window.supabase.createClient("https://oblbfkaqiaroaacecbek.supabase.co","sb_publishable_k9_lzx61xi8htgTqf9Xrwg_neLYUsXk");
const DEFAULT_DATA={"version": 1, "masteryRule": {"requiredStreak": 5, "minimumAttempts": 7}, "words": [{"id": "exclamation", "word": "exclamation", "translation": "восклицание", "definition": "a sudden word or sound that expresses emotion", "example": "“Wow!” was her first exclamation when she saw the view.", "exampleTranslation": "«Вау!» — воскликнула она, увидев вид.", "situation": "Someone suddenly says “Oh no!” after dropping a glass.", "note": "Часто встречается в выражении exclamation mark — восклицательный знак.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "guilty", "word": "guilty", "translation": "виновный; испытывающий чувство вины", "definition": "responsible for doing something wrong, or feeling bad about it", "example": "I felt guilty for forgetting her birthday.", "exampleTranslation": "Я чувствовала себя виноватой, потому что забыла её день рождения.", "situation": "You promised to call a friend but forgot, and now you feel bad.", "note": "Guilty может описывать юридическую вину или чувство вины.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "reasonable", "word": "reasonable", "translation": "разумный; благоразумный; приемлемый", "definition": "fair, sensible, and not extreme", "example": "The hotel price was reasonable for the city centre.", "exampleTranslation": "Цена отеля была приемлемой для центра города.", "situation": "A colleague suggests a practical plan that saves time and money.", "note": "В разговорной речи часто означает «адекватный» или «приемлемый».", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "genuinely", "word": "genuinely", "translation": "искренне; действительно", "definition": "in an honest and sincere way", "example": "I was genuinely happy to see her again.", "exampleTranslation": "Я была искренне рада снова её увидеть.", "situation": "You are truly pleased about someone’s success, not just being polite.", "note": "Наречие от genuine.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "itineraries", "word": "itineraries", "translation": "маршруты; планы поездок", "definition": "detailed travel plans showing places and times", "example": "We compared several itineraries before booking the trip.", "exampleTranslation": "Мы сравнили несколько маршрутов перед бронированием поездки.", "situation": "You have three different travel plans for a week in Italy.", "note": "Единственное число: itinerary.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "bargain-tickets", "word": "bargain tickets", "translation": "выгодные билеты; билеты по очень хорошей цене", "definition": "tickets bought at a much lower price than usual", "example": "We found bargain tickets to Barcelona for only €45.", "exampleTranslation": "Мы нашли выгодные билеты в Барселону всего за 45 евро.", "situation": "A flight is much cheaper than normal, so you book it immediately.", "note": "Также употребляются cheap tickets, discounted tickets и bargain fares.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "glance", "word": "glance", "translation": "быстро взглянуть; короткий взгляд", "definition": "to look quickly, or a quick look", "example": "She glanced at her phone and put it back in her bag.", "exampleTranslation": "Она быстро взглянула на телефон и убрала его обратно в сумку.", "situation": "You look at the clock for one second during a meeting.", "note": "Прошедшее время: glanced.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "follies", "word": "follies", "translation": "глупости; безрассудные поступки", "definition": "foolish actions or decisions", "example": "In the book, he looks back on the follies of his youth.", "exampleTranslation": "В книге он вспоминает безрассудства своей молодости.", "situation": "Someone remembers several foolish choices they made when they were younger.", "note": "Единственное число: folly. Слово немного книжное.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}, {"id": "pathetic-pushover", "word": "pathetic pushover", "translation": "жалкий слабак; человек, которым легко помыкать", "definition": "an insulting phrase for someone who is weak and easily controlled", "example": "He called himself a pathetic pushover because he never said no.", "exampleTranslation": "Он назвал себя жалким слабаком, потому что никогда не умел отказывать.", "situation": "A rude person insults someone who always agrees and never defends themselves.", "note": "Грубое и уничижительное выражение.", "progress": {"attempts": 0, "correct": 0, "wrong": 0, "streak": 0, "mastered": false}}]};
let state,user,mode="choice",queue=[],index=0,score=0,answered=false;
const $=s=>document.querySelector(s),shuffle=a=>[...a].sort(()=>Math.random()-.5),norm=s=>s.toLowerCase().trim().replace(/[“”"'.!,?]/g,"").replace(/\s+/g," ");
function msg(text,ok=true){$("#authStatus").className="status "+(ok?"good":"bad");$("#authStatus").textContent=text}
async function enter(u){user=u;$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");$("#account").textContent=u.email;await loadState()}
async function loadState(){$("#sync").textContent="Загрузка…";const r=await sb.from("vocabulary_state").select("data").eq("user_id",user.id).maybeSingle();if(r.error){$("#sync").textContent=r.error.message;return}if(r.data?.data)state=r.data.data;else{state=structuredClone(DEFAULT_DATA);const x=await sb.from("vocabulary_state").insert({user_id:user.id,data:state});if(x.error){$("#sync").textContent=x.error.message;return}}$("#sync").textContent="Синхронизировано";renderWords();startRound()}
async function save(){$("#sync").textContent="Сохранение…";const r=await sb.from("vocabulary_state").update({data:state,updated_at:new Date().toISOString()}).eq("user_id",user.id);$("#sync").textContent=r.error?r.error.message:"Сохранено в облаке"}
function active(){return state.words.filter(w=>!w.progress.mastered)}function startRound(){queue=shuffle(active());index=0;score=0;render()}function current(){return queue[index]}
function render(){answered=false;$("#next").disabled=true;$("#feedback").innerHTML="";$("#counter").textContent=queue.length?`${index+1} / ${queue.length}`:"";$("#score").textContent=`Верно: ${score}`;if(!queue.length){$("#exercise").innerHTML='<div class="prompt">Все слова выучены</div>';return}if(index>=queue.length){finishRound();return}mode==="choice"?choice():mode==="blank"?blank():situation()}
async function record(ok){if(answered)return;answered=true;if(ok)score++;const p=current().progress;p.attempts++;if(ok){p.correct++;p.streak++}else{p.wrong++;p.streak=0}const r=state.masteryRule||{requiredStreak:5,minimumAttempts:7};if(p.streak>=r.requiredStreak&&p.attempts>=r.minimumAttempts)p.mastered=true;$("#next").disabled=false;$("#score").textContent=`Верно: ${score}`;renderWords();await save()}
function feedback(ok,w){$("#feedback").className="status "+(ok?"good":"bad");$("#feedback").innerHTML=`<b>${ok?"Верно!":"Неверно."}</b><br>${w.example}<br><span class="muted">${w.exampleTranslation||""}</span>`}
function choice(){const w=current(),opts=shuffle([w.translation,...shuffle(state.words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.translation)]);$("#exercise").innerHTML=`<div class="muted">Выберите перевод:</div><div class="prompt">${w.word}</div><div class="options">${opts.map(o=>`<button class="option">${o}</button>`).join("")}</div>`;document.querySelectorAll(".option").forEach(b=>b.onclick=async()=>{if(answered)return;const ok=b.textContent===w.translation;document.querySelectorAll(".option").forEach(x=>{if(x.textContent===w.translation)x.classList.add("correct")});if(!ok)b.classList.add("wrong");await record(ok);feedback(ok,w)})}
function blank(){const w=current(),sentence=(w.example||"").replace(new RegExp(w.word,"i"),"_____").replace(/glanced/i,"_____");$("#exercise").innerHTML=`<div class="muted">Введите слово:</div><div class="prompt" style="font-size:21px">${sentence}</div><div class="row"><input id="answer"><button id="check">Проверить</button></div>`;const check=async()=>{if(answered)return;const forms=w.word==="glance"?["glance","glanced"]:[w.word],ok=forms.some(x=>norm(x)===norm($("#answer").value));await record(ok);feedback(ok,w)};$("#check").onclick=check;$("#answer").onkeydown=e=>{if(e.key==="Enter")check()}}
function situation(){const w=current(),opts=shuffle([w.word,...shuffle(state.words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.word)]);$("#exercise").innerHTML=`<div class="muted">Какое слово подходит?</div><div class="prompt" style="font-size:21px">${w.situation}</div><div class="options">${opts.map(o=>`<button class="option">${o}</button>`).join("")}</div>`;document.querySelectorAll(".option").forEach(b=>b.onclick=async()=>{if(answered)return;const ok=b.textContent===w.word;document.querySelectorAll(".option").forEach(x=>{if(x.textContent===w.word)x.classList.add("correct")});if(!ok)b.classList.add("wrong");await record(ok);feedback(ok,w)})}
async function finishRound(){await save();$("#exercise").innerHTML=`<div class="prompt">Упражнение завершено</div><p>Результат: ${score} из ${queue.length}</p><button id="again">Пройти ещё раз</button>`;$("#next").disabled=true;$("#again").onclick=startRound}
function renderWords(){$("#words").innerHTML=state.words.map(w=>`<div class="word"><b>${w.word}</b> — ${w.translation}<div class="muted">Попыток: ${w.progress.attempts} · ошибок: ${w.progress.wrong} · серия: ${w.progress.streak} · ${w.progress.mastered?"✓ Выучено":"В процессе"}</div></div>`).join("")}
function slugify(value){
  return norm(String(value||""))
    .replace(/[^a-z0-9а-яё\s-]/gi,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-")
    .replace(/^-|-$/g,"") || ("word-"+Date.now());
}
function showImport(text,ok=true){
  $("#importStatus").className="status "+(ok?"good":"bad");
  $("#importStatus").textContent=text;
}
function validateImportedWord(item,index){
  if(!item || typeof item!=="object" || Array.isArray(item))
    return `Элемент ${index+1} должен быть объектом.`;
  const required=["word","translation","definition","example","exampleTranslation","situation","note"];
  const missing=required.filter(k=>typeof item[k]!=="string" || !item[k].trim());
  if(missing.length) return `В слове №${index+1} не заполнены поля: ${missing.join(", ")}.`;
  return null;
}
async function importWords(){
  if(!state) return showImport("Сначала войди в аккаунт.",false);
  let parsed;
  try{
    parsed=JSON.parse($("#importJson").value.trim());
  }catch(e){
    return showImport("JSON содержит ошибку: "+e.message,false);
  }
  if(!Array.isArray(parsed) || !parsed.length)
    return showImport("Нужен непустой JSON-массив.",false);

  for(let i=0;i<parsed.length;i++){
    const error=validateImportedWord(parsed[i],i);
    if(error) return showImport(error,false);
  }

  const existingWords=new Set(state.words.map(w=>norm(w.word)));
  const existingIds=new Set(state.words.map(w=>String(w.id)));
  const added=[];
  const skipped=[];
  const batchSeen=new Set();

  for(const source of parsed){
    const wordKey=norm(source.word);
    if(existingWords.has(wordKey) || batchSeen.has(wordKey)){
      skipped.push(source.word);
      continue;
    }
    let id=source.id ? slugify(source.id) : slugify(source.word);
    const base=id;
    let suffix=2;
    while(existingIds.has(id)) id=`${base}-${suffix++}`;

    state.words.push({
      id,
      word:source.word.trim(),
      translation:source.translation.trim(),
      definition:source.definition.trim(),
      example:source.example.trim(),
      exampleTranslation:source.exampleTranslation.trim(),
      situation:source.situation.trim(),
      note:source.note.trim(),
      progress:{attempts:0,correct:0,wrong:0,streak:0,mastered:false}
    });
    existingWords.add(wordKey);
    existingIds.add(id);
    batchSeen.add(wordKey);
    added.push(source.word.trim());
  }

  if(!added.length)
    return showImport(`Ничего не добавлено. Все слова уже есть: ${skipped.join(", ")}`,false);

  await save();
  renderWords();
  startRound();
  $("#importJson").value="";
  let text=`Добавлено слов: ${added.length}.`;
  if(skipped.length) text+=` Пропущены дубликаты: ${skipped.join(", ")}.`;
  showImport(text,true);
}

$("#signup").onclick=async()=>{const email=$("#email").value.trim(),password=$("#password").value;if(!email||password.length<6)return msg("Укажи email и пароль минимум из 6 символов.",false);const r=await sb.auth.signUp({email,password});if(r.error)return msg(r.error.message,false);if(r.data.session)await enter(r.data.user);else msg("Аккаунт создан. Проверь письмо и подтверди email.")};
$("#login").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});if(r.error)return msg("Не удалось войти: "+r.error.message,false);await enter(r.data.user)};
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("#importWords").onclick=importWords;$("#clearImport").onclick=()=>{$("#importJson").value="";$("#importStatus").innerHTML=""};$("#next").onclick=()=>{index++;render()};$("#hint").onclick=()=>{if(queue.length&&index<queue.length){const w=current();$("#feedback").className="status good";$("#feedback").innerHTML=`<b>Подсказка:</b> ${w.definition}<br>${w.note||""}`}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");mode=t.dataset.mode;startRound()});
(async()=>{const r=await sb.auth.getSession();if(r.data.session)await enter(r.data.session.user)})();
</script></body></html>
